# Pings the Render site so the free instance doesn't spin down (it sleeps after
# 15 min idle, which shows Render's ~1 min loading screen to the next visitor).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --retry 3 --retry-delay 20 --max-time 120 \
            https://hiring-scam-detector.onrender.com/
